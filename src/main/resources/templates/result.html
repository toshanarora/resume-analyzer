<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>ResumeIQ Report</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, sans-serif;
            background:#f4f6f9;
            padding:40px;
            color:#333;
        }

        .container{
            max-width:1100px;
            margin:auto;
        }

        h1{
            text-align:center;
            margin-bottom:10px;
            color:#1e293b;
        }

        .subtitle{
            text-align:center;
            color:#64748b;
            margin-bottom:30px;
        }

        .card{
            background:white;
            padding:25px;
            margin-bottom:20px;
            border-radius:12px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-2px);
        }

        .card h2{
            margin-bottom:15px;
            color:#2563eb;
        }

        ul{
            padding-left:20px;
        }

        li{
            margin-bottom:8px;
        }

        .score{
            font-size:60px;
            font-weight:bold;
            text-align:center;
            color:#2563eb;
        }

        .profile-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:20px;
        }

        .profile-item{
            background:#f8fafc;
            padding:15px;
            border-radius:8px;
        }

        .label{
            font-weight:bold;
            color:#475569;
        }

        .value{
            margin-top:5px;
            font-size:18px;
        }

        .footer{
            text-align:center;
            color:#64748b;
            margin-top:30px;
            font-size:14px;
        }

        @media(max-width:768px){

            .profile-grid{
                grid-template-columns:1fr;
            }

            .score{
                font-size:45px;
            }
        }

    </style>

</head>
<body>

<div class="container">

    <h1>🚀 ResumeIQ Analysis Report</h1>

    <p class="subtitle">
        AI Powered Resume & Career Gap Analysis
    </p>

    <!-- Career Profile -->

    <div class="card">

        <h2>🎯 Career Profile</h2>

        <div class="profile-grid">

            <div class="profile-item">
                <div class="label">Current Profession</div>
                <div class="value"
                     th:text="${report.currentProfession}">
                </div>
            </div>

            <div class="profile-item">
                <div class="label">Target Role</div>
                <div class="value"
                     th:text="${report.targetRole}">
                </div>
            </div>

        </div>

    </div>

    <!-- Match Score -->

    <div class="card">

        <h2>📊 Match Score</h2>

        <div class="score"
             th:text="${report.matchScore + '%'}">
        </div>

    </div>

    <!-- Strengths -->

    <div class="card">

        <h2>💪 Strengths</h2>

        <ul>
            <li th:each="item : ${report.strengths}"
                th:text="${item}">
            </li>
        </ul>

    </div>

    <!-- Weaknesses -->

    <div class="card">

        <h2>⚠ Weaknesses</h2>

        <ul>
            <li th:each="item : ${report.weaknesses}"
                th:text="${item}">
            </li>
        </ul>

    </div>

    <!-- Missing Skills -->

    <div class="card">

        <h2>📚 Missing Skills</h2>

        <ul>
            <li th:each="item : ${report.missingSkills}"
                th:text="${item}">
            </li>
        </ul>

    </div>

    <!-- Learning Roadmap -->

    <div class="card">

        <h2>🛣 Learning Roadmap</h2>

        <ul>
            <li th:each="item : ${report.learningRoadmap}"
                th:text="${item}">
            </li>
        </ul>

    </div>

    <!-- Suggested Jobs -->

    <div class="card">

        <h2>💼 Suggested Jobs</h2>

        <ul>
            <li th:each="item : ${report.suggestedJobs}"
                th:text="${item}">
            </li>
        </ul>

    </div>

    <!-- Career Summary -->

    <div class="card">

        <h2>📝 Career Summary</h2>

        <p th:text="${report.careerSummary}"></p>

    </div>

    <!-- Footer -->

    <div class="footer">

        Generated by ResumeIQ AI

        <br><br>

        <span th:text="${#temporals.format(T(java.time.LocalDateTime).now(),
        'dd MMM yyyy HH:mm')}">
        </span>

    </div>

</div>

</body>
</html>
